<svg xmlns="http://www.w3.org/2000/svg" width="180" height="12" viewBox="0 0 180 12" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f6fd8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3f6fd8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3f6fd8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="10" y1="6" x2="170" y2="6" stroke="url(#g)" stroke-width="1.25" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
  </line>
  <circle cx="90" cy="6" r="2.25" fill="#3f6fd8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="1.8;2.6;1.8" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
