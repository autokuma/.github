<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="AutoKuma">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#050b20"/>
      <stop offset="100%" stop-color="#0a1834"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="#3f6fd8" stop-opacity="0.42">
        <animate attributeName="stop-opacity" values="0.28;0.48;0.28" dur="5.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#3f6fd8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3f6fd8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowSideL" cx="12%" cy="70%" r="28%">
      <stop offset="0%" stop-color="#3f6fd8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3f6fd8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowSideR" cx="88%" cy="30%" r="26%">
      <stop offset="0%" stop-color="#5b8aef" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3f6fd8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f6fd8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3f6fd8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3f6fd8" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mark {
        fill: #3f6fd8;
        filter: url(#softGlow);
      }
      .wordmark {
        fill: #ffffff;
      }
      .logo {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: logoIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }
      .grid line {
        stroke: #3f6fd8;
        stroke-opacity: 0.045;
        stroke-width: 1;
      }
      .orb {
        fill: #3f6fd8;
        opacity: 0.35;
      }
      .orb.b { opacity: 0.22; }
      .orb.c { opacity: 0.18; }
      .accent {
        stroke: url(#lineGrad);
        stroke-width: 1.5;
        stroke-linecap: round;
        fill: none;
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: drawLine 2s ease-out 0.8s forwards, pulseLine 4s ease-in-out 2.8s infinite;
      }
      @keyframes logoIn {
        from { opacity: 0; transform: translateY(10px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseLine {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glowSideL)"/>
  <rect width="1280" height="320" fill="url(#glowSideR)"/>

  <g class="grid">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="213" y1="0" x2="213" y2="320"/>
    <line x1="426" y1="0" x2="426" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="853" y1="0" x2="853" y2="320"/>
    <line x1="1066" y1="0" x2="1066" y2="320"/>
  </g>

  <circle class="orb" cx="180" cy="92" r="3.5">
    <animate attributeName="cy" values="92;82;92" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="180;192;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle class="orb b" cx="1080" cy="70" r="2.5">
    <animate attributeName="cy" values="70;62;70" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1080;1070;1080" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle class="orb c" cx="1180" cy="230" r="4">
    <animate attributeName="cy" values="230;240;230" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle class="orb b" cx="120" cy="250" r="2">
    <animate attributeName="cy" values="250;242;250" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="orb" cx="980" cy="260" r="2.2">
    <animate attributeName="cx" values="980;992;980" dur="12s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(640 152) scale(0.28) translate(-1224 -244)">
    <g class="logo">
      <path class="wordmark" d="M362.44,166.32v19.93c-17.06-15.36-38.71-24.47-64.94-24.47-63.21,0-112.8,52.4-112.8,118.48s49.59,118.48,112.8,118.48c33.06,0,59.84-14.8,78.07-38.71v33.38h59.23v-227.09h-72.36ZM311.77,334.38c-30.21,0-54.16-23.94-54.16-54.13s23.94-54.13,54.16-54.13,54.1,23.94,54.1,54.13-24.5,54.13-54.1,54.13Z"/>
      <path class="wordmark" d="M603.11,297.35c0,21.65-14.8,37.04-34.75,37.04s-34.19-15.38-34.19-37.04v-131.03h-72.92v140.73c0,55.82,38.17,91.7,107.11,91.7s107.08-35.88,107.08-91.7v-140.73h-72.34v131.03Z"/>
      <path class="wordmark" d="M811.43,222.73v81.47c0,18.78,10.81,30.74,26.2,30.74h27.34v56.38c-5.69,4.01-21.07,7.41-36.46,7.41-48.41,0-89.41-37.6-89.41-86.01v-90h-38.19v-56.41h38.19v-75.75h72.33v75.75h54.1v56.41h-54.1Z"/>
      <path class="wordmark" d="M1542.59,297.35c0,21.65-14.83,37.04-34.77,37.04s-34.17-15.38-34.17-37.04v-131.03h-72.92v140.73c0,55.82,38.17,91.7,107.08,91.7s107.11-35.88,107.11-91.7v-140.73h-72.34v131.03Z"/>
      <path class="wordmark" d="M1914.1,161.76c-32.48,0-57.53,14.8-71.79,39.88-13.09-23.92-35.88-39.88-64.94-39.88-26.21,0-47.29,12.54-62.12,32.48v-27.92h-72.92v227.87h72.92v-132.16c0-16.52,10.27-35.88,32.48-35.88,19.94,0,33.03,15.94,33.03,35.88v132.16h72.92v-132.16c0-16.52,10.27-35.88,32.48-35.88,19.94,0,33.61,15.94,33.61,35.88v132.16h72.34v-144.12c0-52.98-27.9-88.3-78.03-88.3Z"/>
      <path class="wordmark" d="M2190.87,166.32v19.93c-17.06-15.36-38.71-24.47-64.91-24.47-63.24,0-112.83,52.4-112.83,118.48s49.59,118.48,112.83,118.48c33.03,0,59.81-14.8,78.04-38.71v33.38h59.26v-227.09h-72.38ZM2140.2,334.38c-30.18,0-54.13-23.94-54.13-54.13s23.94-54.13,54.13-54.13,54.1,23.94,54.1,54.13-24.5,54.13-54.1,54.13Z"/>
      <polygon class="wordmark" points="1397.66 398.51 1303.15 398.51 1233.02 315.72 1223.17 325.12 1223.17 398.51 1150.82 398.51 1150.82 90.56 1223.17 90.56 1223.17 240.05 1302.35 166.32 1389.51 166.32 1284.6 266.48 1397.66 398.51"/>
      <path class="mark" d="M1094.64,360.75c-11.92,12.34-26.23,22.23-42.09,28.63-27.3,11.03-57.75,11.67-85.46,1.84-17.89-6.35-33.82-16.86-46.97-30.51-15.73-16.32-26.34-36.77-30.84-59.03-5.6-28.25-.54-58.35,14.89-82.85-11.23-7.95-18.04-20.5-18.25-34.08-.29-18.38,11.34-34.62,28.78-40.19,21.31-6.1,42.17,4.59,50.04,25.23,28.15-10.45,56.95-10.45,85.39.01,7.62-21.02,30.9-32.37,52.33-24.45,8.56,3.16,15.91,9.41,20.57,17.27,11.36,19.15,5.75,43.52-12.43,56.21,6.99,11.06,11.74,23.09,14.44,35.75,8.17,38.18-3.27,77.96-30.41,106.16ZM1059.51,278.53c0-28.81-23.36-52.17-52.17-52.17s-52.17,23.36-52.17,52.17,23.36,52.17,52.17,52.17,52.17-23.36,52.17-52.17Z"/>
    </g>
  </g>

  <path class="accent" d="M520 232 H760"/>
  <rect width="1280" height="320" fill="url(#sheen)" pointer-events="none"/>
</svg>
